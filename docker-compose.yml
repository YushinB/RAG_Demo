version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=${ANONYMIZED_TELEMETRY:-TRUE}
    networks:
      - rag_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Streamlit app container
  # Uncomment to run the entire stack with Docker
  # streamlit_app:
  #   build: .
  #   container_name: rag_streamlit_app
  #   ports:
  #     - "8501:8501"
  #   volumes:
  #     - .:/app
  #   environment:
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #     - CHROMA_HOST=chromadb
  #     - CHROMA_PORT=8000
  #   depends_on:
  #     chromadb:
  #       condition: service_healthy
  #   networks:
  #     - rag_network
  #   command: streamlit run rag_app.py

volumes:
  chromadb_data:
    driver: local

networks:
  rag_network:
    driver: bridge
